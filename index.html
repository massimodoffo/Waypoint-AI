<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waypoint — AI Travel Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body class="pre-start">

<div id="splash">
  <canvas id="splashCanvas" class="splash-canvas" aria-hidden="true"></canvas>
  <div class="splash-logo"><span class="splash-logo-dot">✦</span> Waypoint AI</div>
  <div class="splash-bottom">
    <div class="splash-slogan">Plan your next <em>adventure</em></div>
    <button class="splash-start-btn" id="splashStartBtn">Explore</button>
  </div>
  <div class="splash-blockout" id="splashBlockout"></div>
</div>

<nav>
  <div style="display:flex;align-items:center;gap:12px">
    <button class="hamburger" id="hamburger" onclick="toggleSidebar()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <div class="logo">
      <span class="logo-dot"></span>
      Waypoint
    </div>
  </div>
  <div class="nav-actions">
    <div class="nav-status"><div class="status-dot"></div>Connected</div>
  </div>
</nav>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="app">
  <aside>
    <div class="sidebar-top">
      <h2>Trips</h2>
      <button class="new-trip-btn" onclick="newTrip()">+ New trip</button>
    </div>
    <div class="trip-list" id="tripList">
      <div class="trip-entry active" data-id="0">
        <span class="trip-entry-icon">✦</span>
        <div>
          <div class="trip-entry-name">New trip</div>
          <div class="trip-entry-meta">Just now</div>
        </div>
      </div>
    </div>
    <div class="sidebar-agents">
      <h2>Agents</h2>
      <div class="agent-pill" id="ap-orchestrator">
        <div class="agent-dot" id="ad-orchestrator"></div>
        <span style="font-size:13px">Orchestrator</span>
      </div>
      <div class="agent-pill" id="ap-itinerary">
        <div class="agent-dot" id="ad-itinerary"></div>
        <span style="font-size:13px">Itinerary</span>
      </div>
      <div class="agent-pill" id="ap-budget">
        <div class="agent-dot" id="ad-budget"></div>
        <span style="font-size:13px">Budget</span>
      </div>
      <div class="agent-pill" id="ap-hotels">
        <div class="agent-dot" id="ad-hotels"></div>
        <span style="font-size:13px">Hotels</span>
      </div>
      <div class="agent-pill" id="ap-local">
        <div class="agent-dot" id="ad-local"></div>
        <span style="font-size:13px">Local Tips</span>
      </div>
    </div>
  </aside>

  <main tabindex="-1">
    <div id="chat"></div>
    <div id="input-wrap">
      <div class="input-box">
        <textarea id="msgInput" placeholder="Tell me where you want to go…" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Send">↑</button>
      </div>
    </div>
  </main>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
