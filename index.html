<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waypoint — AI Travel Agent</title>
<!-- api.fontshare.com serves only the @font-face CSS; the actual woff2 files
     load from cdn.fontshare.com, so both get preconnected (the font CDN
     needs crossorigin since font fetches are always anonymous-CORS). -->
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<!-- Clash Display (display/headlines) + Switzer (body/UI) load at
     400/500/600/700 only — no 300 (Light) or italic faces are requested,
     so any font-weight:300 or font-style:italic on these families falls
     back to the browser's nearest match / synthetic slant instead of a
     real face. css/styles.css avoids both for this reason. -->
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=switzer@400,500,600,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<!-- Leaflet 1.9.4, vendored locally (vendor/leaflet/, from the leaflet npm
     package) rather than loaded from a CDN — a blocked/slow CDN request here
     silently degrades every directions card to its "Open in Google Maps"
     link fallback. -->
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<script src="vendor/leaflet/leaflet.js" defer></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body class="pre-start">

<div id="splash">
  <canvas id="splashCanvas" class="splash-canvas" aria-hidden="true"></canvas>
  <div class="splash-logo"><span class="splash-logo-dot">✦</span> Waypoint AI</div>
  <div class="splash-bottom">
    <div class="splash-slogan">Plan your next <em>adventure</em></div>
    <button class="splash-start-btn" id="splashStartBtn">Explore</button>
  </div>
  <div class="splash-blockout" id="splashBlockout"></div>
</div>

<!-- Revealed by splash.js once the blockout has grown to cover the screen;
     hides again (and hands off to the main app) once auth.js's login
     handler succeeds. See both files' transition comments. -->
<div id="authScreen" class="auth-screen" hidden>
  <div class="auth-shell">
    <div class="auth-core">
      <div class="auth-header">
        <div class="logo"><span class="logo-dot"></span>Waypoint</div>
        <p class="auth-tagline">One account, every trip you plan.</p>
      </div>

      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab active" id="authTabSignup" role="tab" aria-selected="true" aria-controls="authFormSignup">Create account</button>
        <button type="button" class="auth-tab" id="authTabLogin" role="tab" aria-selected="false" aria-controls="authFormLogin">Log in</button>
      </div>

      <div class="auth-message" id="authMessage" role="status" hidden></div>

      <form class="auth-form" id="authFormSignup" novalidate>
        <div class="auth-field-row">
          <div class="auth-field">
            <label for="authFirstName">First name</label>
            <input id="authFirstName" name="firstName" type="text" autocomplete="given-name" required>
          </div>
          <div class="auth-field">
            <label for="authLastName">Last name</label>
            <input id="authLastName" name="lastName" type="text" autocomplete="family-name" required>
          </div>
        </div>
        <div class="auth-field">
          <label for="authSignupEmail">Email</label>
          <input id="authSignupEmail" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="auth-field">
          <label for="authSignupPassword">Password</label>
          <input id="authSignupPassword" name="password" type="password" autocomplete="new-password" minlength="6" required>
        </div>
        <button type="submit" class="auth-submit" id="authSignupSubmit">Create account</button>
      </form>

      <form class="auth-form" id="authFormLogin" novalidate hidden>
        <div class="auth-field">
          <label for="authLoginEmail">Email</label>
          <input id="authLoginEmail" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="auth-field">
          <label for="authLoginPassword">Password</label>
          <input id="authLoginPassword" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="auth-submit" id="authLoginSubmit">Log in</button>
      </form>
    </div>
  </div>
</div>

<nav>
  <div style="display:flex;align-items:center;gap:12px">
    <button class="hamburger" id="hamburger" onclick="toggleSidebar()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <div class="logo">
      <span class="logo-dot"></span>
      Waypoint
    </div>
  </div>
  <div class="nav-actions">
    <div class="nav-status"><div class="status-dot"></div>Connected</div>
    <label class="theme-label" onclick="toggleTheme()">
      <span id="themeIcon">☀</span>
      <span class="theme-toggle"></span>
    </label>
  </div>
</nav>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="app">
  <aside>
    <div class="sidebar-top">
      <h2>Trips</h2>
      <button class="new-trip-btn" onclick="newTrip()">+ New trip</button>
    </div>
    <div class="trip-list" id="tripList">
      <div class="trip-entry active" data-id="0">
        <span class="trip-entry-icon">✦</span>
        <div>
          <div class="trip-entry-name">New trip</div>
          <div class="trip-entry-meta">Just now</div>
        </div>
      </div>
    </div>
    <div class="sidebar-agents">
      <h2>Agents</h2>
      <div class="agent-pill" id="ap-orchestrator">
        <div class="agent-dot" id="ad-orchestrator"></div>
        <span style="font-size:13px">Orchestrator</span>
      </div>
      <div class="agent-pill" id="ap-itinerary">
        <div class="agent-dot" id="ad-itinerary"></div>
        <span style="font-size:13px">Itinerary</span>
      </div>
      <div class="agent-pill" id="ap-budget">
        <div class="agent-dot" id="ad-budget"></div>
        <span style="font-size:13px">Budget</span>
      </div>
      <div class="agent-pill" id="ap-hotels">
        <div class="agent-dot" id="ad-hotels"></div>
        <span style="font-size:13px">Hotels</span>
      </div>
      <div class="agent-pill" id="ap-local">
        <div class="agent-dot" id="ad-local"></div>
        <span style="font-size:13px">Local Tips</span>
      </div>
    </div>
  </aside>

  <main tabindex="-1">
    <div id="chat"></div>
    <div id="input-wrap">
      <div class="input-box">
        <textarea id="msgInput" placeholder="Tell me where you want to go…" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Send">↑</button>
      </div>
    </div>
  </main>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
